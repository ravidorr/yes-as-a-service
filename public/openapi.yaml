openapi: 3.1.1
info:
  title: YaaS API
  version: 1.0.1
  description: |
    Every unmatched path and HTTP method returns `200 text/plain` with `Yes!`.
    Static assets, `GET /version`, `GET /health`, `GET /metrics`, and `/api/yes`
    take precedence over that fallback. Non-GET requests to `/version`, `/health`,
    and `/metrics` use the fallback. Other requests are rate limited per client IP.
    Throttled requests return `429 text/plain` with `Yes!`.
paths:
  /version:
    get:
      summary: Return the package version as plain text
      responses:
        '200':
          description: Package version
          content:
            text/plain:
              schema:
                type: string
  /health:
    get:
      summary: Return service health and package version
      responses:
        '200':
          description: YaaS health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is draining connections during shutdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      summary: Return Prometheus metrics for scraping
      description: |
        Exposes HTTP service metrics and standard Node.js runtime metrics in
        Prometheus text format. Intended for Prometheus scraping. Exempt from
        rate limiting.
      responses:
        '200':
          description: Prometheus metrics exposition format
          content:
            text/plain:
              schema:
                type: string
  /api/yes:
    get:
      responses:
        '200':
          $ref: '#/components/responses/YesResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    put:
      responses:
        '200':
          $ref: '#/components/responses/YesResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    post:
      responses:
        '200':
          $ref: '#/components/responses/YesResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    delete:
      responses:
        '200':
          $ref: '#/components/responses/YesResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    options:
      responses:
        '200':
          $ref: '#/components/responses/YesResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    head:
      responses:
        '200':
          description: Empty response body
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    patch:
      responses:
        '200':
          $ref: '#/components/responses/YesResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    trace:
      responses:
        '200':
          $ref: '#/components/responses/YesResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: Yes!
        version:
          type: string
  responses:
    YesResponse:
      description: YaaS response
      content:
        text/plain:
          schema:
            type: string
            const: Yes!
    ThrottledResponse:
      description: Rate limit exceeded
      content:
        text/plain:
          schema:
            type: string
            const: Yes!
x-yaas-catch-all:
  description: Every unmatched request path and HTTP method returns `200 text/plain` with `Yes!` until throttled, then `429 text/plain` with `Yes!`.
